name: Update GitHub Profile Page
on: [push]

jobs:
  gadpp_job:
    runs-on: ubuntu-latest
    name: Update GitHub Profile Page
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Skip GADPP on non-default branches
        if: github.ref_name != github.event.repository.default_branch
        run: echo "Skipping profile page update outside default branch"
      - name: GADPP
        if: github.ref_name == github.event.repository.default_branch
        uses: umutphp/github-action-dynamic-profile-page@v4
        id: gadpp
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-username: 'umutphp'
          user-email: 'umutphp@gmail.com'
